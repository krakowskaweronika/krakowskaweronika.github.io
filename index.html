<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Portfolio | Personal Brand</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <nav class="glass-nav">
        <div class="logo">Portfolio<span>.</span></div>
        <div class="nav-links">
            <a href="#about" class="nav-item">O mnie</a>
            <a href="#skills" class="nav-item">Skille</a>
            <a href="#projects" class="nav-item">Projekty</a>
            <a href="#contact" class="btn-contact">Kontakt</a>
        </div>
    </nav>

    <section class="hero-v2">
        <div class="hero-content">
            <span class="badge">Senior Developer / Designer</span>
            <h1>Buduję <i>cyfrowe</i> doświadczenia</h1>
            <p>Łączę estetykę pastelowego minimalizmu z czystym, wydajnym kodem.</p>
            
            <div class="grid-menu">
                <div class="glass-card" data-target="about">
                    <div class="card-icon">01</div>
                    <h3>O mnie</h3>
                    <div class="card-line"></div>
                </div>
                <div class="glass-card" data-target="skills">
                    <div class="card-icon">02</div>
                    <h3>Skille</h3>
                    <div class="card-line"></div>
                </div>
                <div class="glass-card" data-target="projects">
                    <div class="card-icon">03</div>
                    <h3>Projekty</h3>
                    <div class="card-line"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
